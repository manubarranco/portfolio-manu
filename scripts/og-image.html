<!doctype html>
<!--
  Source of truth for public/og-image.png (1200x630 social card).
  Regenerate after changing the cover tagline:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=public/og-image.png \
      "file://$PWD/scripts/og-image.html"

  Colors and fonts are the default (Ruralvia-neutral) theme tokens from
  src/styles/global.css. Keep them in sync by hand: this file is rendered
  outside Astro, so it cannot import the stylesheet.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Host+Grotesk:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f1ea;
        --fg: #16160f;
        --accent: #e2341d;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: var(--bg);
        border: 10px solid var(--fg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 86px;
        font-family: 'Host Grotesk', system-ui, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .name {
        display: flex;
        flex-direction: column;
        font-family: 'Bebas Neue', system-ui, sans-serif;
        font-size: 150px;
        line-height: 0.94;
        letter-spacing: -0.01em;
      }
      .name .accent { color: var(--accent); }
      .rule {
        height: 3px;
        background: var(--fg);
        margin: 38px 0 22px;
      }
      .tagline {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
    </style>
  </head>
  <body>
    <div class="name">
      <span>MANU</span>
      <span class="accent">BARRANCO</span>
    </div>
    <div class="rule"></div>
    <p class="tagline">Design Lead · Design Systems · AI Product Design</p>
  </body>
</html>
